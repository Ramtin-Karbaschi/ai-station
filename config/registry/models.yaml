# AI Station Model Registry — canonical runtime aliases and profiles.
# Internal runtime wiring uses aliases (local-*); user-facing names live in
# config/model-catalog.json and are mirrored here for operational clarity.

version: 1
runtime_policy:
  max_active_heavy_profiles: 1
  heavy_profiles:
    - general
    - coder
    - reasoning
    - vision
    - ornith
    - qwen38
    - longwriter
  always_on:
    - embedder
    - llm-gateway
  optional_profiles:
    - reranker

models:
