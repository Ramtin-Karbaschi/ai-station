model_list:
  # Heavy chat/vision models route through the host gateway so selection
  # transparently auto-switches the single active GPU runtime.
  - model_name: Qwen3.6-35B-A3B-UD-Q4_K_M
    litellm_params:
      model: openai/Qwen3.6-35B-A3B-UD-Q4_K_M
      api_base: http://host.docker.internal:8888/v1
      api_key: "not-needed"
      timeout: 600
    model_info:
      id: Qwen3.6-35B-A3B-UD-Q4_K_M
      mode: chat

  - model_name: Qwen3-Coder-30B-A3B-Instruct-Q4
    litellm_params:
      model: openai/Qwen3-Coder-30B-A3B-Instruct-Q4
      api_base: http://host.docker.internal:8888/v1
      api_key: "not-needed"
      timeout: 600
    model_info:
      id: Qwen3-Coder-30B-A3B-Instruct-Q4
      mode: chat

  - model_name: DeepSeek-R1-Distill-Qwen-32B-Q4_K_M
    litellm_params:
      model: openai/DeepSeek-R1-Distill-Qwen-32B-Q4_K_M
      api_base: http://host.docker.internal:8888/v1
      api_key: "not-needed"
      timeout: 600
    model_info:
      id: DeepSeek-R1-Distill-Qwen-32B-Q4_K_M
      mode: chat

  - model_name: Qwen3-VL-32B-Instruct-Q4_K_M
    litellm_params:
      model: openai/Qwen3-VL-32B-Instruct-Q4_K_M
      api_base: http://host.docker.internal:8888/v1
