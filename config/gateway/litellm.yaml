      mode: chat

  - model_name: Qwen3-Embedding-0.6B-Q8_0
    litellm_params:
      model: openai/ai-station-embedding
      api_base: http://embedder:8090/v1
      api_key: "not-needed"
      timeout: 120
    model_info:
      id: Qwen3-Embedding-0.6B-Q8_0
      mode: embedding

  - model_name: Qwen3-Reranker-0.6B-Q8_0
    litellm_params:
      model: openai/ai-station-reranker
      api_base: http://reranker:8091/v1
      api_key: "not-needed"
      timeout: 120
    model_info:
      id: Qwen3-Reranker-0.6B-Q8_0
      mode: rerank

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true
  request_timeout: 600
  num_retries: 1
  turn_off_message_logging: true
  cache: false
  disable_spend_logs: false
  disable_error_logs: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  # Keep chat serving if Postgres briefly flaps (WSL/Docker restart races).
  allow_requests_on_db_unavailable: true
  disable_spend_logs: false
  disable_master_key_return: true
  alerting: []
