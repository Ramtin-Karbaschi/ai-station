# On-demand llama.cpp runtimes.
# One heavy profile is the default on ~24GB VRAM; multi-GPU operators must
# select explicit device IDs and configure admission before running profiles
# concurrently (ADR-031).
# Always start heavy profiles via: scripts/ai models use <profile>
# or: docker compose --profile <name> up -d

x-llama-common: &llama-common
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  restart: unless-stopped
  # Compose's device request is intentionally one GPU by default (ADR-031).
  # Operators select a real NVIDIA index with AI_STATION_GPU_DEVICE_ID; `all`
  # is not the default because it hides placement mistakes and can
  # oversubscribe cards.
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["${AI_STATION_GPU_DEVICE_ID:-0}"]
            capabilities: [gpu]
  env_file:
    - .env.models
  volumes:
    - ${MODELS_DIR:-/srv/ai-station/models}:/models:ro
  networks:
    - default
    - ai-platform

x-llama-cpu-common: &llama-cpu-common
  image: ghcr.io/ggml-org/llama.cpp:server-cuda
  restart: unless-stopped
  env_file:
    - .env.models
  environment:
    CUDA_VISIBLE_DEVICES: ""
  volumes:
    - ${MODELS_DIR:-/srv/ai-station/models}:/models:ro
  networks:
    - default
    - ai-platform
  cpus: 6
  mem_limit: 24g
  memswap_limit: 24g

services:
  llm-general-cpu:
    <<: *llama-cpu-common
    profiles: ["cpu-chat"]
    container_name: ai-station-llm-general-cpu
    command:
      - -m
      - /models/${LLM_GENERAL_MODEL_FILE:-qwen38/qwen3.8-27b-ud-q4_k_m.gguf}
      - --alias
      - ai-station-general-cpu
      - --host
      - 0.0.0.0
      - --port
      - "8089"
      - -ngl
      - "0"
      - -c
      - "2048"
      - -n
      - "512"
      - --parallel
      - "1"
    ports:
      - "127.0.0.1:8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8089/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  llm-general:
    <<: *llama-common
    profiles: ["general"]
    container_name: ai-station-llm-general
    command:
      - -m
      - /models/${LLM_GENERAL_MODEL_FILE:-qwen38/qwen3.8-27b-ud-q4_k_m.gguf}
      - --mmproj
      - /models/${LLM_GENERAL_MMPROJ_FILE:-qwen38/mmproj-f16.gguf}
      - --no-mmproj-offload
      - --alias
      - ai-station-general
      - --reasoning
      - "auto"
      - --reasoning-budget
      - "2048"
      - --n-predict
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - -ngl
      - "999"
      - -c
      - "${LLM_GENERAL_CONTEXT:-8192}"
      - --parallel
      - "${LLM_GENERAL_PARALLEL:-1}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - "${LLM_GENERAL_CACHE_TYPE_K:-q4_0}"
      - --cache-type-v
      - "${LLM_GENERAL_CACHE_TYPE_V:-q4_0}"
    ports:
      - "127.0.0.1:${GENERAL_LLM_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  llm-coder:
    <<: *llama-common
    profiles: ["coder"]
    container_name: ai-station-llm-coder
    command:
      - -m
      - /models/${LLM_CODER_MODEL_FILE:-ornith/ornith-1.5-35b-q4_k_m.gguf}
      - --alias
      - ai-station-coder
      - --reasoning
      - "auto"
      - --reasoning-budget
      - "2048"
      - --n-predict
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8083"
      - -ngl
      - "${LLM_CODER_GPU_LAYERS:-999}"
      - -c
      - "${LLM_CODER_CONTEXT:-8192}"
      - --parallel
      - "${LLM_CODER_PARALLEL:-1}"
      - --cache-type-k
      - "${LLM_CODER_CACHE_TYPE_K:-q4_0}"
      - --cache-type-v
      - "${LLM_CODER_CACHE_TYPE_V:-q4_0}"
      # Ornith's 21 GiB weights plus a 262k-token KV cache exceed 24 GiB VRAM.
      # Retain the advertised context while keeping its KV cache in host RAM.
      - --no-kv-offload
      - --flash-attn
      - "on"
    ports:
      - "127.0.0.1:${CODER_LLM_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  llm-reasoning:
    <<: *llama-common
    profiles: ["reasoning"]
    container_name: ai-station-llm-reasoning
    command:
      - -m
      - /models/${REASONING_MODEL_FILE:-qwen38/qwen3.8-27b-ud-q4_k_m.gguf}
      - --alias
      - ai-station-reasoning
      - --reasoning
      - "on"
      - --jinja
      - --n-predict
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "8084"
      - -ngl
      - "999"
      - -c
      - "${REASONING_CONTEXT:-8192}"
      - --parallel
      - "${REASONING_PARALLEL:-1}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - "${REASONING_CACHE_TYPE_K:-q4_0}"
      - --cache-type-v
      - "${REASONING_CACHE_TYPE_V:-q4_0}"
    ports:
      - "127.0.0.1:${REASONING_LLM_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  llm-vision:
    <<: *llama-common
    profiles: ["vision"]
    container_name: ai-station-llm-vision
    command:
      - -m
      - /models/${VISION_MODEL_FILE:-qwen38/qwen3.8-27b-ud-q4_k_m.gguf}
      - --mmproj
      - /models/${VISION_MMPROJ_FILE:-qwen38/mmproj-f16.gguf}
      - --alias
      - ai-station-vision
      - --reasoning
      - "auto"
      - --reasoning-budget
      - "2048"
      - --n-predict
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "8085"
      - -ngl
      - "999"
      - -c
      - "${VISION_CONTEXT:-16384}"
      - --parallel
      - "${VISION_PARALLEL:-1}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - "${VISION_CACHE_TYPE_K:-q4_0}"
      - --cache-type-v
      - "${VISION_CACHE_TYPE_V:-q4_0}"
    ports:
      - "127.0.0.1:${VISION_LLM_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  llm-ornith:
    <<: *llama-common
    profiles: ["ornith"]
    container_name: ai-station-llm-ornith
    command:
      - -m
      - /models/${LLM_ORNITH_MODEL_FILE:-ornith/ornith-1.5-35b-q4_k_m.gguf}
      - --alias
      - ai-station-ornith
      - --reasoning
      - "auto"
      - --reasoning-budget
      - "2048"
      - --n-predict
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8086"
      - -ngl
      - "${LLM_ORNITH_GPU_LAYERS:-999}"
      - -c
      - "${LLM_ORNITH_CONTEXT:-8192}"
      - --parallel
      - "${LLM_ORNITH_PARALLEL:-1}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - "${LLM_ORNITH_CACHE_TYPE_K:-q4_0}"
      - --cache-type-v
      - "${LLM_ORNITH_CACHE_TYPE_V:-q4_0}"
    ports:
      - "127.0.0.1:${ORNITH_LLM_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  llm-qwen38:
    <<: *llama-common
    profiles: ["qwen38"]
    container_name: ai-station-llm-qwen38
    command:
      - -m
      - /models/${LLM_QWEN38_MODEL_FILE:-qwen38/qwen3.8-27b-ud-q4_k_m.gguf}
      - --mmproj
      - /models/${LLM_QWEN38_MMPROJ_FILE:-qwen38/mmproj-f16.gguf}
      - --alias
      - ai-station-qwen38
      - --n-predict
      - "4096"
      - --host
      - 0.0.0.0
      - --port
      - "8087"
      - -ngl
      - "999"
      - -c
      - "${LLM_QWEN38_CONTEXT:-8192}"
      - --parallel
      - "${LLM_QWEN38_PARALLEL:-1}"
      - --flash-attn
      - "on"
      - --cache-type-k
      - "${LLM_QWEN38_CACHE_TYPE_K:-q4_0}"
      - --cache-type-v
      - "${LLM_QWEN38_CACHE_TYPE_V:-q4_0}"
    ports:
      - "127.0.0.1:${QWEN38_LLM_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8087/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  llm-longwriter:
    <<: *llama-common
    profiles: ["longwriter"]
    container_name: ai-station-llm-longwriter
    command:
      - -m
      - /models/${LLM_LONGWRITER_MODEL_FILE:-longwriter/longwriter-zero-32b-q4_k_m.gguf}
      - --alias
      - ai-station-longwriter
      - --host
      - 0.0.0.0
      - --port
      - "8088"
      - -ngl
      - "${LLM_LONGWRITER_GPU_LAYERS:-999}"
      - -c
      - "${LLM_LONGWRITER_CONTEXT:-8192}"
      - --parallel
      - "${LLM_LONGWRITER_PARALLEL:-1}"
    ports:
      - "127.0.0.1:${LONGWRITER_LLM_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s

  # Small model; CPU-only by default so it can coexist with a heavy GPU model.
  reranker:
    # Keep the pinned image/volumes/network from llama-common, but clear its
    # device reservation. `-ngl 0` only controls llama.cpp offload; it does
    # not stop Compose from requesting NVIDIA at container creation time.
    <<: *llama-common
    deploy: {}
    profiles: ["reranker"]
    container_name: ai-station-reranker
    gpus: []
    command:
      - -m
      - /models/${RERANKER_MODEL_FILE:-reranker/qwen3-reranker-4b-q6_k.gguf}
      - --alias
      - ai-station-reranker
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - -ngl
      - "0"
      - -c
      - "${RERANKER_CONTEXT:-4096}"
      - --embedding
      - --pooling
      - rank
      - --rerank
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # CPU-only so ASR can coexist with one heavy GPU chat profile (ADR-027).
  asr-qwen3:
    <<: *llama-common
    deploy: {}
    profiles: ["asr"]
    container_name: ai-station-asr-qwen3
    gpus: []
    command:
      - -m
      - /models/${ASR_MODEL_FILE:-asr/qwen3-asr-1.7b-q8_0.gguf}
      - --mmproj
      - /models/${ASR_MMPROJ_FILE:-asr/mmproj-qwen3-asr-1.7b-q8_0.gguf}
      - --alias
      - ai-station-asr
      - --host
      - 0.0.0.0
      - --port
      - "8092"
      - -ngl
      - "0"
      - -c
      - "${ASR_CONTEXT:-8192}"
    ports:
      - "127.0.0.1:${ASR_PORT:-8092}:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8092/v1/models >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
