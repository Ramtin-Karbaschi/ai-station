<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AI Station — private local GenAI control plane</title>
  <desc id="description">AI Station connects people through Open WebUI and applications through a LiteLLM OpenAI-compatible API to locally routed llama.cpp models, retrieval, OCR, search and speech services.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.58" stop-color="#0A1723"/>
      <stop offset="1" stop-color="#0B2030"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102330" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0B1925" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <ellipse cx="1040" cy="95" rx="310" ry="235" fill="url(#aura)"/>
  <path d="M0 332C250 283 412 383 661 326C900 271 1017 292 1200 247V360H0Z" fill="#5EEAD4" opacity="0.025"/>

  <!-- Wordmark -->
  <g transform="translate(66 58)">
    <rect width="62" height="62" rx="17" fill="#0C2130" stroke="url(#brand)" stroke-width="2"/>
    <path d="M17 42V24L31 16L45 24V42L31 50Z" fill="none" stroke="#D9F9F3" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="31" cy="16" r="3.8" fill="#5EEAD4"/>
    <circle cx="17" cy="24" r="3.8" fill="#60A5FA"/>
    <circle cx="45" cy="24" r="3.8" fill="#60A5FA"/>
    <circle cx="31" cy="50" r="3.8" fill="#5EEAD4"/>
    <path d="M17 42H45M31 16V50" stroke="#93C5FD" stroke-width="1.8" opacity="0.7"/>
  </g>

  <text x="151" y="102" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="45" font-weight="700" letter-spacing="2.5">AI STATION</text>
  <rect x="151" y="116" width="196" height="3" rx="1.5" fill="url(#brand)"/>

  <text x="66" y="174" fill="#F1F5F9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600">Your models. Your data. Your machine.</text>
  <text x="66" y="208" fill="#A7B8C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A private, local GenAI control plane for people and applications.</text>

  <g transform="translate(66 240)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="650" letter-spacing="1">
    <g>
      <rect width="112" height="30" rx="15" fill="#5EEAD4" opacity="0.1"/>
      <circle cx="17" cy="15" r="3" fill="#5EEAD4"/>
      <text x="29" y="19" fill="#BFF8EE">LOCAL-FIRST</text>
    </g>
    <g transform="translate(122)">
      <rect width="184" height="30" rx="15" fill="#60A5FA" opacity="0.1"/>
      <circle cx="17" cy="15" r="3" fill="#60A5FA"/>
      <text x="29" y="19" fill="#C9E2FF">OPENAI-COMPATIBLE</text>
    </g>
    <g transform="translate(316)">
      <rect width="138" height="30" rx="15" fill="#A78BFA" opacity="0.1"/>
      <circle cx="17" cy="15" r="3" fill="#A78BFA"/>
      <text x="29" y="19" fill="#DDD6FE">REPRODUCIBLE</text>
    </g>
  </g>

  <g transform="translate(66 310)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">
    <path d="M0 0H12" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round"/>
    <text x="21" y="4" fill="#7F93A7">Loopback by default</text>
    <path d="M185 0H197" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
    <text x="206" y="4" fill="#7F93A7">One GPU model at a time</text>
    <path d="M384 0H396" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
    <text x="405" y="4" fill="#7F93A7">Audit-ready releases</text>
  </g>

  <!-- Current architecture, reduced to its public contracts -->
  <g transform="translate(585 42)" filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="551" height="276" rx="23" fill="url(#card)" stroke="#6EE7D8" stroke-opacity="0.18"/>
    <text x="28" y="35" fill="#71869A" font-size="11" font-weight="700" letter-spacing="1.6">LOCAL CONTROL PLANE</text>
    <circle cx="512" cy="31" r="4" fill="#5EEAD4"/>
    <text x="500" y="35" fill="#739687" font-size="10" text-anchor="end" letter-spacing="1">PRIVATE</text>

    <g transform="translate(28 58)">
      <text x="0" y="18" fill="#6F8498" font-size="10" font-weight="700" letter-spacing="1.2">PEOPLE</text>
      <rect x="70" width="150" height="42" rx="11" fill="#102A36" stroke="#5EEAD4" stroke-opacity="0.7"/>
      <circle cx="89" cy="21" r="4" fill="#5EEAD4"/>
      <text x="103" y="25" fill="#DDFBF6" font-size="13" font-weight="600">Open WebUI</text>
      <text x="207" y="25" fill="#5F7B83" font-size="9" text-anchor="end">:3000</text>

      <text x="0" y="76" fill="#6F8498" font-size="10" font-weight="700" letter-spacing="1.2">APPS</text>
      <rect x="70" y="58" width="150" height="42" rx="11" fill="#10263A" stroke="#60A5FA" stroke-opacity="0.75"/>
      <circle cx="89" cy="79" r="4" fill="#60A5FA"/>
      <text x="103" y="83" fill="#E0EFFF" font-size="13" font-weight="600">LiteLLM API</text>
      <text x="207" y="83" fill="#607A91" font-size="9" text-anchor="end">:4000</text>

      <path d="M220 21H243C255 21 255 50 267 50M220 79H243C255 79 255 50 267 50" fill="none" stroke="#648096" stroke-width="1.6"/>
      <path d="M263 46L269 50L263 54" fill="none" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="270" y="19" width="112" height="62" rx="13" fill="#13283A" stroke="url(#brand)" stroke-width="1.5"/>
      <text x="326" y="44" fill="#F0FDFA" font-size="13" font-weight="650" text-anchor="middle">ROUTING</text>
      <text x="326" y="61" fill="#8FA7B9" font-size="10" text-anchor="middle">keys · admission</text>

      <path d="M382 50H399" stroke="#7DD3FC" stroke-width="1.6"/>
      <path d="M395 46L401 50L395 54" fill="none" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="402" y="4" width="93" height="92" rx="14" fill="#0D1E2B" stroke="#A78BFA" stroke-opacity="0.7"/>
      <path d="M432 28H464M428 37H468M433 46H463" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
      <text x="448.5" y="68" fill="#EEEAFE" font-size="13" font-weight="650" text-anchor="middle">llama.cpp</text>
      <text x="448.5" y="83" fill="#8E86A7" font-size="9" text-anchor="middle">LOCAL GPU</text>
    </g>

    <path d="M28 179H523" stroke="#33485A" stroke-opacity="0.65"/>

    <g transform="translate(28 198)">
      <text x="0" y="12" fill="#71869A" font-size="10" font-weight="700" letter-spacing="1.2">LOCAL SERVICES</text>
      <g transform="translate(0 26)" font-size="11" font-weight="600">
        <rect width="80" height="27" rx="8" fill="#112733"/>
        <text x="40" y="18" fill="#A9C7C5" text-anchor="middle">RAG</text>
        <rect x="88" width="80" height="27" rx="8" fill="#112733"/>
        <text x="128" y="18" fill="#A9C7C5" text-anchor="middle">OCR</text>
        <rect x="176" width="80" height="27" rx="8" fill="#112733"/>
        <text x="216" y="18" fill="#A9C7C5" text-anchor="middle">SEARCH</text>
        <rect x="264" width="80" height="27" rx="8" fill="#112733"/>
        <text x="304" y="18" fill="#A9C7C5" text-anchor="middle">SPEECH</text>
        <rect x="352" width="143" height="27" rx="8" fill="#112733"/>
        <text x="423.5" y="18" fill="#A9C7C5" text-anchor="middle">PGVECTOR + REDIS</text>
      </g>
    </g>
  </g>
</svg>
